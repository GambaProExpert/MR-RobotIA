[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrrobotia"
version = "0.6.0"
description = "Auditor de postura defensiva para despliegues locales de LLM auto alojados (TFG)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# De momento solo usa la biblioteca estándar; sin dependencias en ejecución.
dependencies = []
authors = [
    {name = "Sergio"},
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mrrobotia = "mrrobotia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrrobotia = [
    "datos/*.jsonl",
    "datos/*.json",
    "datos/julius_sondas/*.yaml",
    "datos/julius_sondas/NOTICE",
    "datos/julius_sondas/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
